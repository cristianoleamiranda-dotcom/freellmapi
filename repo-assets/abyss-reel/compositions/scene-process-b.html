<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>ABYSS — Proceso B</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Cinzel";
          src: url("assets/fonts/cinzel-latin-700-normal.woff2") format("woff2");
          font-weight: 700;
          font-display: block;
        }
        @font-face {
          font-family: "Montserrat";
          src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2");
          font-weight: 600;
          font-display: block;
        }

        #root {
          --ink: #14100d;
          --cream: #eae3dd;
          --cream-dim: #c6b7ab;
          --sage: #9ec4ba;
          --serif: "Cinzel", serif;
          --sans: "Montserrat", sans-serif;
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: var(--ink);
          color: var(--cream);
          font-family: var(--sans);
        }

        .shot {
          position: absolute;
          inset: 0;
          overflow: hidden;
        }
        .shot video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .scrim {
          position: absolute;
          inset: 0;
          background: linear-gradient(
            to bottom,
            rgba(20, 16, 13, 0.9) 0%,
            rgba(20, 16, 13, 0.62) 30%,
            rgba(20, 16, 13, 0.5) 60%,
            rgba(20, 16, 13, 0.96) 100%
          );
        }

        .headline {
          position: absolute;
          left: 96px;
          right: 96px;
          top: 232px;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }
        .kicker {
          font-size: 20px;
          font-weight: 600;
          letter-spacing: 0.44em;
          text-transform: uppercase;
          color: #bcdcd4;
        }
        .h {
          display: flex;
          flex-direction: column;
          font-family: var(--serif);
          font-weight: 700;
          font-size: 104px;
          line-height: 1.0;
          letter-spacing: 0.02em;
          text-transform: uppercase;
          color: var(--cream);
        }
        .h .dim {
          color: rgba(234, 227, 221, 0.6);
        }

        .foot {
          position: absolute;
          left: 96px;
          right: 96px;
          bottom: 208px;
          display: flex;
          align-items: center;
          gap: 18px;
        }
        .dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: var(--sage);
        }
        .foot-text {
          font-size: 21px;
          font-weight: 600;
          letter-spacing: 0.3em;
          text-transform: uppercase;
          color: var(--cream-dim);
        }

        .stamp {
          position: absolute;
          right: 96px;
          bottom: 208px;
          font-family: var(--serif);
          font-size: 30px;
          letter-spacing: 0.18em;
          color: rgba(158, 196, 186, 0.85);
        }
      </style>

      <div id="root" data-composition-id="scene-process-b" data-width="1080" data-height="1920">
        <div class="shot">
          <video
            id="proc-video-2"
            src="assets/clips/clip-pierna.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="2.6"
            data-media-start="0.4"
            data-track-index="1"
          ></video>
          <div class="scrim" id="scrim-2"></div>
        </div>

        <div class="headline">
          <div class="kicker" id="proc-kicker">Sesión privada</div>
          <div class="h">
            <span class="dim" id="proc-l1">Tu diseño</span>
            <span id="proc-l2">se queda</span>
          </div>
        </div>

        <div class="foot" id="proc-foot">
          <span class="dot"></span>
          <span class="foot-text">Diseño único · Agenda abierta</span>
        </div>
        <div class="stamp" id="proc-stamp">02 / 02</div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        tl.fromTo("#proc-video-2", { scale: 1.06 }, { scale: 1.2, duration: 2.6, ease: "none" }, 0);
        tl.fromTo("#proc-kicker", { y: 22, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.5, ease: "power3.out" }, 0.12);
        tl.fromTo("#proc-l1", { x: -34, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "power4.out" }, 0.24);
        tl.fromTo("#proc-l2", { x: 34, autoAlpha: 0 }, { x: 0, autoAlpha: 1, duration: 0.7, ease: "power4.out" }, 0.38);
        tl.fromTo("#proc-foot", { y: 20, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.55, ease: "power3.out" }, 0.7);
        tl.fromTo("#proc-stamp", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.45 }, 0.8);

        window.__timelines["scene-process-b"] = tl;
        tl.seek(0);
      </script>
    </template>
  </body>
</html>
