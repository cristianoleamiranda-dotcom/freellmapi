<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>ABYSS Tattoo Studio — Reel</title>

    <style>
      @font-face {
        font-family: "Cinzel";
        src: url("assets/fonts/cinzel-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/montserrat-latin-600-normal.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }

      :root {
        --ink: #14100d;
        --ink-2: #1a1512;
        --cream: #eae3dd;
        --cream-dim: #c6b7ab;
        --sage: #9ec4ba;
        --serif: "Cinzel", serif;
        --sans: "Montserrat", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
        color: var(--cream);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--ink);
      }

      #stage > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }

      /* ---------- persistent finish ---------- */
      .fx {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .fx-vignette {
        background: radial-gradient(ellipse at 50% 42%, rgba(20, 16, 13, 0) 34%, rgba(20, 16, 13, 0.82) 100%);
      }
      .fx-grain {
        opacity: 0.16;
        background-image: radial-gradient(rgba(234, 227, 221, 0.55) 0.5px, transparent 0.5px);
        background-size: 3px 3px;
        mix-blend-mode: overlay;
      }
      .fx-frame {
        inset: 46px;
        border: 1px solid rgba(198, 183, 171, 0.22);
      }
      .fx-bar {
        position: absolute;
        left: 46px;
        right: 46px;
        height: 3px;
        background: rgba(198, 183, 171, 0.16);
      }
      .fx-bar.top {
        top: 132px;
      }
      .fx-bar.bot {
        bottom: 132px;
      }
      #progress {
        position: absolute;
        left: 46px;
        bottom: 132px;
        height: 3px;
        width: 0%;
        background: var(--sage);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="abyss-reel"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-duration="24"
      data-fps="30"
    >
      <div class="fx fx-vignette"></div>
      <div class="fx fx-grain"></div>
      <div class="fx fx-frame"></div>
      <div class="fx-bar top"></div>
      <div class="fx-bar bot"></div>
      <div id="progress"></div>

      <!-- 1 · OPEN -->
      <div
        id="el-open"
        data-composition-id="scene-open"
        data-composition-src="compositions/scene-open.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- 2 · GALERÍA -->
      <div
        id="el-gallery"
        data-composition-id="scene-gallery"
        data-composition-src="compositions/scene-gallery.html"
        data-start="4"
        data-duration="7"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- 3 · PROCESO (dos planos) -->
      <div
        id="el-process-a"
        data-composition-id="scene-process-a"
        data-composition-src="compositions/scene-process-a.html"
        data-start="11"
        data-duration="2.8"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <div
        id="el-process-b"
        data-composition-id="scene-process-b"
        data-composition-src="compositions/scene-process-b.html"
        data-start="13.8"
        data-duration="2.6"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- 4 · GALERÍA 2 -->
      <div
        id="el-gallery-2"
        data-composition-id="scene-gallery-2"
        data-composition-src="compositions/scene-gallery-2.html"
        data-start="16.4"
        data-duration="3.6"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- 5 · CTA -->
      <div
        id="el-cta"
        data-composition-id="scene-cta"
        data-composition-src="compositions/scene-cta.html"
        data-start="20"
        data-duration="4"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script src="assets/vendor/gsap.min.js"></script>
    <script>
      const tl = gsap.timeline({ paused: true });

      /* progress hairline tracks the 24s runtime */
      tl.fromTo("#progress", { width: "0%" }, { width: "100%", duration: 24, ease: "none" }, 0);

      window.__timelines["abyss-reel"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
